name: CD

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  cancel_previous_runs:
    runs-on: ubuntu-latest
    name: Cancel Previous Runs
    permissions:
      actions: write
    steps:
    - uses: styfle/cancel-workflow-action@0.13.1
      with:
        access_token: ${{ github.token }}

  test_ubuntu:
    needs: [cancel_previous_runs]
    runs-on: ubuntu-latest
    name: Test Ubuntu
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-ubuntu.sh
    - name: Build & Test
      run: .github/scripts/build-ubuntu.sh

  test_windows:
    needs: [cancel_previous_runs]
    runs-on: windows-2022
    name: Test Windows
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-windows.sh
      shell: bash
    - name: Build & Test
      run: .github/scripts/build-windows.sh
      shell: bash

  test_macos:
    needs: [cancel_previous_runs]
    runs-on: macos-latest
    name: Test macOS
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-macos.sh ci
    - name: Build & Test
      run: .github/scripts/build-macos.sh debug arm64 && .github/scripts/build-macos.sh debug x86_64

  build_release_windows_x86:
    needs: [test_ubuntu, test_windows, test_macos]
    name: Build Release Windows x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_single_core_x86
          path: build/bin/RelWithDebInfo/solvespace_single_core_x86.exe

  build_release_windows_openmp_x86:
    needs: [test_ubuntu, test_windows, test_macos]
    name: Build Release Windows (OpenMP) x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release openmp
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_x86
          path: build/bin/RelWithDebInfo/solvespace_x86.exe

  build_release_windows_x64:
    needs: [test_ubuntu, test_windows, test_macos]
    name: Build Release Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release not_openmp x64
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_single_core_x64
          path: build/bin/RelWithDebInfo/solvespace_single_core_x64.exe

  build_release_windows_openmp_x64:
    needs: [test_ubuntu, test_windows, test_macos]
    name: Build Release Windows (OpenMP) x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: .github/scripts/install-windows.sh
        shell: bash
      - name: Build & Test
        run: .github/scripts/build-windows.sh release openmp x64
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows_x64
          path: build/bin/RelWithDebInfo/solvespace_x64.exe

  build_release_macos:
    needs: [test_ubuntu, test_windows, test_macos]
    name: Build Release macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-macos.sh ci
    - name: Build & Test
      run: .github/scripts/build-macos.sh release arm64 && .github/scripts/build-macos.sh release x86_64
    - name: Package Build (unsigned)
      run: .github/scripts/package-macos-unsigned.sh
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: macos
        path: build/bin/SolveSpace.dmg

  build_release_web:
    needs: [test_ubuntu, test_windows, test_macos]
    name: Build Release Web
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: .github/scripts/install-web.sh
    - name: Build & Pack
      run: |
        .github/scripts/build-web.sh release
        cd build/bin
        rm *.a || true
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: solvespace_web
        path: build/bin/

  build_release_flatpak:
    needs: [test_ubuntu, test_windows, test_macos]
    name: Build Release Flatpak x86_64
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-21.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: "solvespace.flatpak"
          manifest-path: "pkg/flatpak/com.solvespace.SolveSpace.json"
          cache-key: flatpak-builder-${{ github.sha }}

  # deploy_snap_amd64:
  #   needs: [test_ubuntu, test_windows, test_macos]
  #   name: Deploy AMD64 Snap
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v6
  #   - name: Fetch Tags
  #     run: git fetch --force --tags
  #   - name: Set Up Source
  #     run: rsync --filter=":- .gitignore" -r ./ pkg/snap/solvespace-snap-src
  #   - name: Build Snap
  #     uses: snapcore/action-build@v1
  #     id: build
  #     with:
  #       path: pkg/snap
  #   - name: Upload & Release to Edge
  #     if: github.event_name == 'push'
  #     uses: snapcore/action-publish@v1
  #     env:
  #       SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPSTORE_LOGIN }}
  #     with:
  #       snap: ${{ steps.build.outputs.snap }}
  #       release: edge
  #   - name: Upload & Release to Beta + Edge
  #     if: github.event_name == 'release'
  #     uses: snapcore/action-publish@v1
  #     with:
  #       store_login: ${{ secrets.SNAPSTORE_LOGIN }}
  #       snap: ${{ steps.build.outputs.snap }}
  #       release: edge,beta

  upload_release_assets:
    name: Upload Release Assets
    needs:
      - build_release_windows_x86
      - build_release_windows_openmp_x86
      - build_release_windows_x64
      - build_release_windows_openmp_x64
      - build_release_macos
      - build_release_flatpak
    if: "!cancelled() && github.event_name == 'release'"
    runs-on: ubuntu-latest
    steps:
    - name: Download All Workflow Artifacts
      uses: actions/download-artifact@v8

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          windows_single_core_x86/solvespace_single_core_x86.exe
          windows_x86/solvespace_x86.exe
          windows_single_core_x64/solvespace_single_core_x64.exe
          windows_x64/solvespace_x64.exe
          macos/SolveSpace.dmg
          solvespace-x86_64.flatpak/solvespace.flatpak
